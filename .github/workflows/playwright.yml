name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ENV_NAME:
        description: 'Target environment (demo | dev)'
        required: false
        default: 'demo'

env:
  ENV_NAME: ${{ github.event.inputs.ENV_NAME || 'demo' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  #  Job 1: API Tests
  # ──────────────────────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run API tests
        run: npx playwright test tests/API-Test --project=api --reporter=html,allure-playwright
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          CI: true
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Upload Playwright HTML report (API)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results (API)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-api
          path: allure-results/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  #  Job 2: UI Tests
  # ──────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: UI Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run setup (auth)
        run: npx playwright test --project=setup
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          CI: true
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Run UI tests
        run: npx playwright test tests/UI-Test --project=chromium --reporter=html,allure-playwright
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          CI: true
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Upload Playwright HTML report (UI)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results (UI)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-ui
          path: allure-results/
          retention-days: 14

      - name: Upload screenshots & videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-ui
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  #  Job 3: k6 Performance Tests
  # ──────────────────────────────────────────────────────────────────────────
  performance-tests:
    name: Performance Tests (k6)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Setup Node.js (for TypeScript transpilation)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run k6 load test
        run: k6 run tests/performance/load-test.perf.ts
        env:
          ENV_NAME: ${{ env.ENV_NAME }}

      - name: Upload k6 performance results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: performance-results
          path: performance-results/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  #  Job 4: Generate & Publish Allure Report (runs after both test jobs)
  # ──────────────────────────────────────────────────────────────────────────
  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure results (API)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/

      - name: Download Allure results (UI)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results/

      - name: Setup Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Publish Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: allure-report
